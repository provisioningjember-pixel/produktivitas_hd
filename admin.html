<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUD Permintaan - Firebase RTDB Optimized</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    [v-cloak] { display: none; }
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      width: 18px;
      height: 18px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- Top Navbar -->
  <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 mb-6 shadow-md">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2.5 rounded-lg font-bold">
          <i class="fa-solid fa-database text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white">CRUD Permintaan RTDB</h1>
          <p class="text-xs text-slate-400">Optimized for Large Datasets & Rules Indexed</p>
        </div>
      </div>
      <button id="btnTambahData" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold px-4 py-2.5 rounded-lg shadow transition flex items-center gap-2">
        <i class="fa-solid fa-plus"></i> Tambah Permintaan
      </button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4">
    <!-- Filter & Search Section -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 mb-6 shadow-sm flex flex-col md:flex-row gap-4 justify-between items-center">
      <form id="formCari" class="flex items-center gap-2 w-full md:w-auto flex-1 max-w-md">
        <div class="relative w-full">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="inputCariTiket" placeholder="Cari Tiket ID (contoh: TK-2026...)" class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
        </div>
        <button type="submit" class="bg-slate-700 hover:bg-slate-600 text-white text-sm font-medium px-4 py-2 rounded-lg transition flex items-center gap-2">
          Cari
        </button>
        <button type="button" id="btnResetCari" class="bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm px-3 py-2 rounded-lg transition hidden" title="Reset Pencarian">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
      </form>

      <div class="flex items-center gap-3 w-full md:w-auto justify-end">
        <label for="selectLimit" class="text-xs text-slate-400 font-medium">Baris per halaman:</label>
        <select id="selectLimit" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          <option value="10">10</option>
          <option value="25" selected>25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
    </div>

    <!-- Alert Container -->
    <div id="alertBox" class="hidden mb-4 p-4 rounded-lg text-sm font-medium flex justify-between items-center">
      <span id="alertMessage"></span>
      <button onclick="document.getElementById('alertBox').classList.add('hidden')" class="text-slate-400 hover:text-white">&times;</button>
    </div>

    <!-- Data Table Card -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-lg">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900/80 text-xs uppercase text-slate-400 border-b border-slate-700">
            <tr>
              <th class="px-4 py-3">Tiket ID</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3">Kategori / Segmen</th>
              <th class="px-4 py-3">Teknisi</th>
              <th class="px-4 py-3">HD</th>
              <th class="px-4 py-3">Waktu Buat</th>
              <th class="px-4 py-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-700/60">
            <tr>
              <td colspan="7" class="text-center py-10 text-slate-500">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl text-indigo-500 mb-2"></i>
                <p>Memuat data dari Firebase...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination Footer -->
      <div class="bg-slate-900/60 px-6 py-4 border-t border-slate-700 flex flex-col sm:flex-row items-center justify-between gap-4">
        <span class="text-xs text-slate-400" id="infoPaginasi">Menampilkan data...</span>
        <div class="flex items-center gap-2">
          <button id="btnPrevPage" class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed border border-slate-700 text-xs px-3 py-2 rounded-lg transition font-medium">
            <i class="fa-solid fa-chevron-left mr-1"></i> Sebelum
          </button>
          <button id="btnNextPage" class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed border border-slate-700 text-xs px-3 py-2 rounded-lg transition font-medium">
            Selanjutnya <i class="fa-solid fa-chevron-right ml-1"></i>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- MODAL FORM (CREATE & EDIT) -->
  <div id="modalForm" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="px-6 py-4 border-b border-slate-700 flex justify-between items-center sticky top-0 bg-slate-800 z-10">
        <h3 id="modalTitle" class="text-lg font-bold text-white">Tambah Data Permintaan</h3>
        <button id="btnCloseModal" class="text-slate-400 hover:text-white text-xl">&times;</button>
      </div>

      <form id="formPermintaan" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="hidden" id="inputNodeKey" value="">

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Tiket ID *</label>
          <input type="text" id="f_tiket_id" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Status *</label>
          <select id="f_status" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-indigo-500 focus:outline-none">
            <option value="OPEN">OPEN</option>
            <option value="PROGRESS">PROGRESS</option>
            <option value="CLOSED">CLOSED</option>
            <option value="PENDING">PENDING</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Kategori Pekerjaan</label>
          <input type="text" id="f_kategori_pekerjaan" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Segmen</label>
          <input type="text" id="f_segmen" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Nama Teknisi</label>
          <input type="text" id="f_nama_teknisi" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Username Teknisi</label>
          <input type="text" id="f_username_teknisi" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">ID Telegram Teknisi</label>
          <input type="text" id="f_id_telegram_teknisi" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Nama HD</label>
          <input type="text" id="f_nama_hd" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">NIK HD</label>
          <input type="text" id="f_nik_hd" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">ID Telegram HD</label>
          <input type="text" id="f_id_telegram_hd" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Chat ID</label>
          <input type="text" id="f_chat_id" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Message ID</label>
          <input type="text" id="f_message_id" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">File ID</label>
          <input type="text" id="f_file_id" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Timestamp Created</label>
          <input type="text" id="f_timestamp_created" placeholder="Auto-generated jika kosong" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-slate-400 mb-1">Pesan</label>
          <textarea id="f_pesan" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-indigo-500 focus:outline-none"></textarea>
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-slate-400 mb-1">Keterangan</label>
          <textarea id="f_keterangan" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-indigo-500 focus:outline-none"></textarea>
        </div>

        <div class="md:col-span-2 flex justify-end gap-3 mt-4 border-t border-slate-700 pt-4">
          <button type="button" id="btnCancelForm" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition">Batal</button>
          <button type="submit" id="btnSaveForm" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-semibold transition flex items-center gap-2">
            <span>Simpan Data</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Scripts (Modular Version 10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getDatabase, 
      ref, 
      get, 
      push, 
      update, 
      remove, 
      query, 
      orderByChild, 
      limitToLast, 
      endAt, 
      equalTo 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Konfigurasi Firebase Anda
    const firebaseConfig = {
      apiKey: "AIzaSyCIEJHWd7EBzC0FeWgtlmNF0CHpPcyCrK4",
      authDomain: "forminput-9c324.firebaseapp.com",
      projectId: "forminput-9c324",
      storageBucket: "forminput-9c324.firebasestorage.app",
      messagingSenderId: "105974451173",
      appId: "1:105974451173:web:d2976fc5ed60dad0d23d0c",
      databaseURL: "https://forminput-9c324-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, "permintaan");

    // State Management
    let currentLimit = 25;
    let pageHistory = []; // menyimpan key/timestamp batas halaman
    let currentDataMap = new Map(); // Simpan data halaman aktif untuk pencarian cepat saat edit

    // DOM Elements
    const tableBody = document.getElementById("tableBody");
    const selectLimit = document.getElementById("selectLimit");
    const btnPrevPage = document.getElementById("btnPrevPage");
    const btnNextPage = document.getElementById("btnNextPage");
    const infoPaginasi = document.getElementById("infoPaginasi");
    const formCari = document.getElementById("formCari");
    const inputCariTiket = document.getElementById("inputCariTiket");
    const btnResetCari = document.getElementById("btnResetCari");
    
    const modalForm = document.getElementById("modalForm");
    const modalTitle = document.getElementById("modalTitle");
    const formPermintaan = document.getElementById("formPermintaan");
    const btnTambahData = document.getElementById("btnTambahData");
    const btnCloseModal = document.getElementById("btnCloseModal");
    const btnCancelForm = document.getElementById("btnCancelForm");

    // Initialize App
    window.addEventListener("DOMContentLoaded", () => {
      loadDataPage();
      setupEventListeners();
    });

    function setupEventListeners() {
      selectLimit.addEventListener("change", (e) => {
        currentLimit = parseInt(e.target.value);
        pageHistory = [];
        loadDataPage();
      });

      btnNextPage.addEventListener("click", () => {
        if (currentDataMap.size > 0) {
          const firstKey = Array.from(currentDataMap.values())[0];
          pageHistory.push(firstKey.timestamp_created || null);
          loadDataPage(firstKey.timestamp_created);
        }
      });

      btnPrevPage.addEventListener("click", () => {
        pageHistory.pop();
        const prevBound = pageHistory[pageHistory.length - 1];
        loadDataPage(prevBound);
      });

      formCari.addEventListener("submit", (e) => {
        e.preventDefault();
        const queryTiket = inputCariTiket.value.trim();
        if (queryTiket) {
          cariByTiketId(queryTiket);
        }
      });

      btnResetCari.addEventListener("click", () => {
        inputCariTiket.value = "";
        btnResetCari.classList.add("hidden");
        pageHistory = [];
        loadDataPage();
      });

      // Modal Triggers
      btnTambahData.addEventListener("click", () => openModal("create"));
      btnCloseModal.addEventListener("click", closeModal);
      btnCancelForm.addEventListener("click", closeModal);

      // Submit Form (Create / Update)
      formPermintaan.addEventListener("submit", handleFormSubmit);

      // Event Delegation untuk Tombol Edit & Hapus pada Tabel
      tableBody.addEventListener("click", (e) => {
        const targetBtn = e.target.closest("button");
        if (!targetBtn) return;

        const key = targetBtn.getAttribute("data-key");
        const action = targetBtn.getAttribute("data-action");

        if (action === "edit") {
          editDataByKey(key);
        } else if (action === "delete") {
          hapusDataByKey(key);
        }
      });
    }

    // LOAD DATA PER PAGINASI (Ringan & Cepat)
    async function loadDataPage(endAtTimestamp = null) {
      showTableLoading();
      try {
        let q;
        if (endAtTimestamp) {
          q = query(
            dbRef, 
            orderByChild("timestamp_created"), 
            endAt(endAtTimestamp), 
            limitToLast(currentLimit + 1)
          );
        } else {
          q = query(
            dbRef, 
            orderByChild("timestamp_created"), 
            limitToLast(currentLimit + 1)
          );
        }

        const snapshot = await get(q);
        currentDataMap.clear();

        if (!snapshot.exists()) {
          renderTable([]);
          infoPaginasi.innerText = "Tidak ada data ditemukan.";
          btnPrevPage.disabled = pageHistory.length === 0;
          btnNextPage.disabled = true;
          return;
        }

        let items = [];
        snapshot.forEach((child) => {
          items.push({
            key: child.key,
            ...child.val()
          });
        });

        // Simpan data di map local
        items.forEach(item => currentDataMap.set(item.key, item));

        btnPrevPage.disabled = pageHistory.length === 0;
        btnNextPage.disabled = items.length <= currentLimit;

        // Potong kelebihan 1 item untuk paginasi halaman berikutnya
        if (items.length > currentLimit) {
          items.shift();
        }

        renderTable(items.reverse());
        infoPaginasi.innerText = `Menampilkan ${items.length} baris data terbaru.`;

      } catch (err) {
        console.error("Gagal load data:", err);
        showAlert("Error memuat data: " + err.message, "danger");
      }
    }

    // PENCARIAN TIKET SPESIFIK (equalTo)
    async function cariByTiketId(tiketId) {
      showTableLoading();
      btnResetCari.classList.remove("hidden");
      try {
        const q = query(dbRef, orderByChild("tiket_id"), equalTo(tiketId));
        const snapshot = await get(q);

        currentDataMap.clear();
        if (!snapshot.exists()) {
          renderTable([]);
          infoPaginasi.innerText = `Tiket ID "${tiketId}" tidak ditemukan.`;
          btnPrevPage.disabled = true;
          btnNextPage.disabled = true;
          return;
        }

        let items = [];
        snapshot.forEach((child) => {
          items.push({
            key: child.key,
            ...child.val()
          });
        });

        items.forEach(item => currentDataMap.set(item.key, item));
        renderTable(items);
        infoPaginasi.innerText = `Ditemukan ${items.length} data untuk Tiket ID: ${tiketId}`;
        btnPrevPage.disabled = true;
        btnNextPage.disabled = true;

      } catch (err) {
        console.error("Gagal cari data:", err);
        showAlert("Pencarian gagal: " + err.message, "danger");
      }
    }

    // RENDER TABLE TO DOM
    function renderTable(items) {
      if (items.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="7" class="text-center py-8 text-slate-500">
              <i class="fa-solid fa-folder-open text-3xl mb-2"></i>
              <p>Data kosong atau tidak ditemukan.</p>
            </td>
          </tr>`;
        return;
      }

      tableBody.innerHTML = items.map(item => `
        <tr class="hover:bg-slate-700/40 transition">
          <td class="px-4 py-3 font-semibold text-indigo-400">${item.tiket_id || '-'}</td>
          <td class="px-4 py-3">${getBadgeStatus(item.status)}</td>
          <td class="px-4 py-3">
            <div class="font-medium text-slate-200">${item.kategori_pekerjaan || '-'}</div>
            <div class="text-xs text-slate-400">${item.segmen || '-'}</div>
          </td>
          <td class="px-4 py-3">
            <div>${item.nama_teknisi || '-'}</div>
            <div class="text-xs text-slate-500">@${item.username_teknisi || '-'}</div>
          </td>
          <td class="px-4 py-3">${item.nama_hd || '-'}</td>
          <td class="px-4 py-3 text-xs text-slate-400">${formatDate(item.timestamp_created)}</td>
          <td class="px-4 py-3 text-center">
            <div class="flex items-center justify-center gap-2">
              <button data-key="${item.key}" data-action="edit" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 text-xs px-2.5 py-1.5 rounded-md font-medium transition flex items-center gap-1">
                <i class="fa-solid fa-pen-to-square"></i> Edit
              </button>
              <button data-key="${item.key}" data-action="delete" class="bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 text-xs px-2.5 py-1.5 rounded-md font-medium transition flex items-center gap-1">
                <i class="fa-solid fa-trash-can"></i> Hapus
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    // FORM ACTION: CREATE / UPDATE
    async function handleFormSubmit(e) {
      e.preventDefault();
      const nodeKey = document.getElementById("inputNodeKey").value;

      const payload = {
        tiket_id: document.getElementById("f_tiket_id").value.trim(),
        status: document.getElementById("f_status").value,
        kategori_pekerjaan: document.getElementById("f_kategori_pekerjaan").value.trim(),
        segmen: document.getElementById("f_segmen").value.trim(),
        nama_teknisi: document.getElementById("f_nama_teknisi").value.trim(),
        username_teknisi: document.getElementById("f_username_teknisi").value.trim(),
        id_telegram_teknisi: document.getElementById("f_id_telegram_teknisi").value.trim(),
        nama_hd: document.getElementById("f_nama_hd").value.trim(),
        nik_hd: document.getElementById("f_nik_hd").value.trim(),
        id_telegram_hd: document.getElementById("f_id_telegram_hd").value.trim(),
        chat_id: document.getElementById("f_chat_id").value.trim(),
        message_id: document.getElementById("f_message_id").value.trim(),
        file_id: document.getElementById("f_file_id").value.trim(),
        pesan: document.getElementById("f_pesan").value.trim(),
        keterangan: document.getElementById("f_keterangan").value.trim(),
        timestamp_created: document.getElementById("f_timestamp_created").value.trim() || new Date().toISOString()
      };

      try {
        if (nodeKey) {
          // UPDATE DATA EXISTING
          const targetRef = ref(db, `permintaan/${nodeKey}`);
          await update(targetRef, payload);
          showAlert("Data berhasil diperbarui!", "success");
        } else {
          // TAMBAH DATA BARU (PUSH)
          await push(dbRef, payload);
          showAlert("Data baru berhasil ditambahkan!", "success");
        }
        closeModal();
        loadDataPage();
      } catch (err) {
        console.error("Gagal menyimpan:", err);
        showAlert("Gagal menyimpan data: " + err.message, "danger");
      }
    }

    // EDIT DATA
    function editDataByKey(key) {
      const data = currentDataMap.get(key);
      if (!data) return;

      document.getElementById("inputNodeKey").value = key;
      document.getElementById("f_tiket_id").value = data.tiket_id || "";
      document.getElementById("f_status").value = data.status || "OPEN";
      document.getElementById("f_kategori_pekerjaan").value = data.kategori_pekerjaan || "";
      document.getElementById("f_segmen").value = data.segmen || "";
      document.getElementById("f_nama_teknisi").value = data.nama_teknisi || "";
      document.getElementById("f_username_teknisi").value = data.username_teknisi || "";
      document.getElementById("f_id_telegram_teknisi").value = data.id_telegram_teknisi || "";
      document.getElementById("f_nama_hd").value = data.nama_hd || "";
      document.getElementById("f_nik_hd").value = data.nik_hd || "";
      document.getElementById("f_id_telegram_hd").value = data.id_telegram_hd || "";
      document.getElementById("f_chat_id").value = data.chat_id || "";
      document.getElementById("f_message_id").value = data.message_id || "";
      document.getElementById("f_file_id").value = data.file_id || "";
      document.getElementById("f_pesan").value = data.pesan || "";
      document.getElementById("f_keterangan").value = data.keterangan || "";
      document.getElementById("f_timestamp_created").value = data.timestamp_created || "";

      openModal("edit");
    }

    // HAPUS DATA
    async function hapusDataByKey(key) {
      const data = currentDataMap.get(key);
      const label = data ? data.tiket_id : key;

      if (confirm(`Apakah Anda yakin ingin menghapus data dengan Tiket ID "${label}"?`)) {
        try {
          const targetRef = ref(db, `permintaan/${key}`);
          await remove(targetRef);
          showAlert(`Data "${label}" berhasil dihapus.`, "success");
          loadDataPage();
        } catch (err) {
          console.error("Gagal menghapus:", err);
          showAlert("Gagal menghapus data: " + err.message, "danger");
        }
      }
    }

    // MODAL UTILS
    function openModal(mode = "create") {
      if (mode === "create") {
        formPermintaan.reset();
        document.getElementById("inputNodeKey").value = "";
        modalTitle.innerText = "Tambah Data Permintaan";
      } else {
        modalTitle.innerText = "Edit Data Permintaan";
      }
      modalForm.classList.remove("hidden");
    }

    function closeModal() {
      modalForm.classList.add("hidden");
    }

    // UI HELPER FUNCTIONS
    function showTableLoading() {
      tableBody.innerHTML = `
        <tr>
          <td colspan="7" class="text-center py-10 text-slate-500">
            <i class="fa-solid fa-circle-notch fa-spin text-2xl text-indigo-500 mb-2"></i>
            <p>Memuat data...</p>
          </td>
        </tr>`;
    }

    function showAlert(msg, type = "success") {
      const alertBox = document.getElementById("alertBox");
      const alertMessage = document.getElementById("alertMessage");

      alertBox.className = `mb-4 p-4 rounded-lg text-sm font-medium flex justify-between items-center ${
        type === "success" ? "bg-emerald-950/80 border border-emerald-700 text-emerald-200" : "bg-rose-950/80 border border-rose-700 text-rose-200"
      }`;
      alertMessage.innerText = msg;
      alertBox.classList.remove("hidden");

      setTimeout(() => alertBox.classList.add("hidden"), 5000);
    }

    function getBadgeStatus(status) {
      if (!status) return `<span class="bg-slate-700 text-slate-300 text-[10px] px-2 py-0.5 rounded font-bold">UNKNOWN</span>`;
      const st = status.toUpperCase();
      if (st === "OPEN") return `<span class="bg-blue-500/20 text-blue-400 border border-blue-500/30 text-[10px] px-2 py-0.5 rounded font-bold">OPEN</span>`;
      if (st === "CLOSED") return `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] px-2 py-0.5 rounded font-bold">CLOSED</span>`;
      if (st === "PROGRESS") return `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] px-2 py-0.5 rounded font-bold">PROGRESS</span>`;
      return `<span class="bg-purple-500/20 text-purple-400 border border-purple-500/30 text-[10px] px-2 py-0.5 rounded font-bold">${st}</span>`;
    }

    function formatDate(ts) {
      if (!ts) return "-";
      try {
        const d = new Date(ts);
        if (isNaN(d.getTime())) return ts;
        return d.toLocaleString("id-ID", { dateStyle: "short", timeStyle: "medium" });
      } catch (e) {
        return ts;
      }
    }
  </script>
</body>
</html>
