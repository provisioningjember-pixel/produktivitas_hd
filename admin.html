<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Permintaan - Firebase RTDB Optimization</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <div class="max-w-7xl mx-auto px-4 py-6">
    <!-- Header -->
    <div class="flex justify-between items-center bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-900"><i class="fa-solid fa-database text-indigo-600 mr-2"></i>Data Permintaan</h1>
        <p class="text-slate-500 text-sm mt-1">Sistem Pengelolaan Data Berbasis Firebase RTDB dengan Optimasi Pagination</p>
      </div>
      <button id="btnOpenCreateModal" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2.5 rounded-lg text-sm flex items-center transition">
        <i class="fa-solid fa-plus mr-2"></i>Tambah Permintaan
      </button>
    </div>

    <!-- Filter & Direct Search Bar -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 justify-between items-center">
      <!-- Search Specific Ticket ID -->
      <form id="searchForm" class="flex items-center gap-2 w-full md:w-auto flex-1 max-w-md">
        <div class="relative w-full">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="searchInput" placeholder="Cari langsung Tiket ID (contoh: TKT-1001)..." 
            class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white text-sm px-4 py-2 rounded-lg transition">
          Cari
        </button>
      </form>

      <!-- Page Size & Refresh -->
      <div class="flex items-center gap-3">
        <label class="text-xs font-medium text-slate-500">Baris per halaman:</label>
        <select id="pageSizeSelect" class="border border-slate-300 rounded-lg text-sm px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="10" selected>10</option>
          <option value="25">25</option>
          <option value="50">50</option>
        </select>
        <button id="btnRefresh" class="border border-slate-300 hover:bg-slate-50 text-slate-600 px-3 py-1.5 rounded-lg text-sm transition" title="Muat Ulang Data Awal">
          <i class="fa-solid fa-rotate-right"></i> Reset
        </button>
      </div>
    </div>

    <!-- Data Table Container -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold uppercase text-xs">
              <th class="p-3">Tiket ID</th>
              <th class="p-3">Status</th>
              <th class="p-3">Kategori & Segmen</th>
              <th class="p-3">Teknisi</th>
              <th class="p-3">HD</th>
              <th class="p-3">Waktu Dibuat</th>
              <th class="p-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100">
            <!-- Loading Indicator -->
            <tr id="loadingRow">
              <td colspan="7" class="text-center py-12 text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-indigo-600"></i>
                <p>Memuat data...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination Footer Controls -->
      <div class="p-4 bg-slate-50 border-t border-slate-200 flex justify-between items-center text-sm text-slate-600">
        <div>
          Halaman: <span id="currentPageDisplay" class="font-bold text-slate-800">1</span>
        </div>
        <div class="flex gap-2">
          <button id="btnPrevPage" disabled class="px-3 py-1.5 bg-white border border-slate-300 rounded-md text-xs font-medium text-slate-600 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-slate-100">
            <i class="fa-solid fa-chevron-left mr-1"></i> Sebelumnya
          </button>
          <button id="btnNextPage" disabled class="px-3 py-1.5 bg-white border border-slate-300 rounded-md text-xs font-medium text-slate-600 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-slate-100">
            Berikutnya <i class="fa-solid fa-chevron-right ml-1"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Create/Edit -->
  <div id="modalForm" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
      <div class="p-6 border-b border-slate-200 flex justify-between items-center sticky top-0 bg-white">
        <h2 id="modalTitle" class="text-lg font-bold text-slate-800">Tambah Permintaan</h2>
        <button id="btnCloseModal" class="text-slate-400 hover:text-slate-600 text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <form id="permintaanForm" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Hidden key field for Editing -->
        <input type="hidden" id="recordKey">

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Tiket ID *</label>
          <input type="text" id="tiket_id" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Status</label>
          <select id="status" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="OPEN">OPEN</option>
            <option value="PROGRESS">PROGRESS</option>
            <option value="CLOSED">CLOSED</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Kategori Pekerjaan</label>
          <input type="text" id="kategori_pekerjaan" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Segmen</label>
          <input type="text" id="segmen" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Nama Teknisi</label>
          <input type="text" id="nama_teknisi" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Username Telegram Teknisi</label>
          <input type="text" id="username_teknisi" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">ID Telegram Teknisi</label>
          <input type="text" id="id_telegram_teknisi" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Nama HD</label>
          <input type="text" id="nama_hd" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">NIK HD</label>
          <input type="text" id="nik_hd" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">ID Telegram HD</label>
          <input type="text" id="id_telegram_hd" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Chat ID</label>
          <input type="text" id="chat_id" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Message ID</label>
          <input type="text" id="message_id" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">File ID</label>
          <input type="text" id="file_id" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Timestamp Created</label>
          <input type="text" id="timestamp_created" readonly class="w-full px-3 py-2 border border-slate-200 bg-slate-100 rounded-lg text-sm text-slate-500">
        </div>

        <div class="col-span-1 md:col-span-2">
          <label class="block text-xs font-medium text-slate-700 mb-1">Pesan</label>
          <textarea id="pesan" rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
        </div>

        <div class="col-span-1 md:col-span-2">
          <label class="block text-xs font-medium text-slate-700 mb-1">Keterangan</label>
          <textarea id="keterangan" rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
        </div>

        <div class="col-span-1 md:col-span-2 flex justify-end gap-3 mt-4 pt-4 border-t border-slate-200">
          <button type="button" id="btnCancelModal" class="px-4 py-2 border border-slate-300 text-slate-600 rounded-lg text-sm hover:bg-slate-50">Batal</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getDatabase, ref, push, set, update, remove, 
      query, orderByChild, limitToLast, endAt, get, equalTo
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Konfigurasi Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCIEJHWd7EBzC0FeWgtlmNF0CHpPcyCrK4",
      authDomain: "forminput-9c324.firebaseapp.com",
      projectId: "forminput-9c324",
      storageBucket: "forminput-9c324.firebasestorage.app",
      messagingSenderId: "105974451173",
      appId: "1:105974451173:web:d2976fc5ed60dad0d23d0c",
      databaseURL: "https://forminput-9c324-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const nodePath = "permintaan";

    // State Pagination
    let pageSize = 10;
    let pageHistory = []; // Menyimpan timestamp batas atas setiap halaman
    let currentPage = 1;
    let currentData = {};

    // DOM Elements
    const tableBody = document.getElementById('tableBody');
    const loadingRow = document.getElementById('loadingRow');
    const btnPrevPage = document.getElementById('btnPrevPage');
    const btnNextPage = document.getElementById('btnNextPage');
    const currentPageDisplay = document.getElementById('currentPageDisplay');
    const pageSizeSelect = document.getElementById('pageSizeSelect');
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const btnRefresh = document.getElementById('btnRefresh');

    const modalForm = document.getElementById('modalForm');
    const permintaanForm = document.getElementById('permintaanForm');
    const btnOpenCreateModal = document.getElementById('btnOpenCreateModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnCancelModal = document.getElementById('btnCancelModal');
    const modalTitle = document.getElementById('modalTitle');

    // --- FUNCTION: FETCH DATA WITH PAGINATION (Optimized) ---
    async function loadPage(endAtTimestamp = null, isNext = true) {
      showLoading(true);
      
      try {
        let dbQuery;
        const dbRef = ref(db, nodePath);

        // Ambil N + 1 data untuk mengecek ketersediaan halaman berikutnya
        if (endAtTimestamp !== null) {
          dbQuery = query(dbRef, orderByChild('timestamp_created'), endAt(endAtTimestamp), limitToLast(pageSize + 1));
        } else {
          dbQuery = query(dbRef, orderByChild('timestamp_created'), limitToLast(pageSize + 1));
        }

        const snapshot = await get(dbQuery);
        
        if (!snapshot.exists()) {
          tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400">Tidak ada data ditemukan</td></tr>`;
          btnNextPage.disabled = true;
          btnPrevPage.disabled = currentPage === 1;
          showLoading(false);
          return;
        }

        let items = [];
        snapshot.forEach((childSnap) => {
          items.push({
            key: childSnap.key,
            ...childSnap.val()
          });
        });

        // Firebase limitToLast mengembalikan urutan ascending, balikkan urutan ke descending (terbaru di atas)
        items.reverse();

        let hasMore = false;
        if (items.length > pageSize) {
          hasMore = true;
          items.pop(); // Buang data tambahan yang hanya dipakai untuk cek ketersediaan
        }

        // Render data ke tabel
        renderTable(items);

        // Atur status Tombol
        btnNextPage.disabled = !hasMore;
        btnPrevPage.disabled = currentPage === 1;
        currentPageDisplay.textContent = currentPage;

        // Simpan titik batas timestamp untuk halaman saat ini
        if (items.length > 0) {
          currentData = items;
        }

      } catch (error) {
        console.error("Gagal mengambil data:", error);
        alert("Terjadi kesalahan saat memuat data: " + error.message);
      } finally {
        showLoading(false);
      }
    }

    // --- FUNCTION: DIRECT SEARCH BY TICKET ID ---
    async function searchByTicketId(tiketId) {
      if (!tiketId.trim()) {
        resetPagination();
        return;
      }

      showLoading(true);
      try {
        const dbRef = ref(db, nodePath);
        const searchQuery = query(dbRef, orderByChild('tiket_id'), equalTo(tiketId.trim()));
        const snapshot = await get(searchQuery);

        if (snapshot.exists()) {
          let items = [];
          snapshot.forEach((child) => {
            items.push({ key: child.key, ...child.val() });
          });
          renderTable(items);
        } else {
          tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400">Tiket ID "<b>${tiketId}</b>" tidak ditemukan.</td></tr>`;
        }
        btnNextPage.disabled = true;
        btnPrevPage.disabled = true;
      } catch (err) {
        console.error("Error search:", err);
        alert("Pencarian gagal: " + err.message);
      } finally {
        showLoading(false);
      }
    }

    // --- FUNCTION: RENDER TABLE BODY ---
    function renderTable(items) {
      if (items.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400">Data kosong</td></tr>`;
        return;
      }

      tableBody.innerHTML = items.map(item => {
        const createdDate = item.timestamp_created ? new Date(item.timestamp_created).toLocaleString('id-ID') : '-';
        
        // Color badge status
        let statusColor = "bg-slate-100 text-slate-600";
        if (item.status === "OPEN") statusColor = "bg-amber-100 text-amber-700";
        if (item.status === "PROGRESS") statusColor = "bg-blue-100 text-blue-700";
        if (item.status === "CLOSED") statusColor = "bg-emerald-100 text-emerald-700";

        return `
          <tr class="hover:bg-slate-50 transition border-b border-slate-100">
            <td class="p-3 font-semibold text-indigo-600">${item.tiket_id || '-'}</td>
            <td class="p-3">
              <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${statusColor}">${item.status || 'OPEN'}</span>
            </td>
            <td class="p-3">
              <div class="font-medium text-slate-800">${item.kategori_pekerjaan || '-'}</div>
              <div class="text-xs text-slate-400">${item.segmen || '-'}</div>
            </td>
            <td class="p-3">
              <div class="text-slate-700">${item.nama_teknisi || '-'}</div>
              <div class="text-xs text-slate-400">@${item.username_teknisi || '-'}</div>
            </td>
            <td class="p-3 text-slate-700">${item.nama_hd || '-'}</td>
            <td class="p-3 text-xs text-slate-500">${createdDate}</td>
            <td class="p-3 text-center">
              <div class="flex justify-center gap-2">
                <button onclick="window.editRecord('${item.key}')" class="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded transition" title="Edit">
                  <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button onclick="window.deleteRecord('${item.key}')" class="p-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded transition" title="Hapus">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    // --- PAGINATION HANDLERS ---
    function resetPagination() {
      currentPage = 1;
      pageHistory = [];
      loadPage();
    }

    btnNextPage.addEventListener('click', () => {
      if (currentData.length > 0) {
        // Ambil timestamp item terakhir di halaman saat ini
        const lastItemTimestamp = currentData[currentData.length - 1].timestamp_created;
        pageHistory.push(lastItemTimestamp);
        currentPage++;
        loadPage(lastItemTimestamp - 1, true);
      }
    });

    btnPrevPage.addEventListener('click', () => {
      if (currentPage > 1) {
        pageHistory.pop();
        currentPage--;
        const previousTimestamp = pageHistory.length > 0 ? pageHistory[pageHistory.length - 1] - 1 : null;
        loadPage(previousTimestamp, false);
      }
    });

    pageSizeSelect.addEventListener('change', (e) => {
      pageSize = parseInt(e.target.value);
      resetPagination();
    });

    btnRefresh.addEventListener('click', () => {
      searchInput.value = '';
      resetPagination();
    });

    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      searchByTicketId(searchInput.value);
    });

    // --- CREATE & UPDATE HANDLERS ---
    permintaanForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const key = document.getElementById('recordKey').value;
      const formData = {
        tiket_id: document.getElementById('tiket_id').value,
        status: document.getElementById('status').value,
        kategori_pekerjaan: document.getElementById('kategori_pekerjaan').value,
        segmen: document.getElementById('segmen').value,
        nama_teknisi: document.getElementById('nama_teknisi').value,
        username_teknisi: document.getElementById('username_teknisi').value,
        id_telegram_teknisi: document.getElementById('id_telegram_teknisi').value,
        nama_hd: document.getElementById('nama_hd').value,
        nik_hd: document.getElementById('nik_hd').value,
        id_telegram_hd: document.getElementById('id_telegram_hd').value,
        chat_id: document.getElementById('chat_id').value,
        message_id: document.getElementById('message_id').value,
        file_id: document.getElementById('file_id').value,
        pesan: document.getElementById('pesan').value,
        keterangan: document.getElementById('keterangan').value,
      };

      try {
        if (key) {
          // UPDATE
          if (formData.status === 'CLOSED' && !formData.timestamp_close) {
            formData.timestamp_close = Date.now();
          }
          await update(ref(db, `${nodePath}/${key}`), formData);
          alert('Data berhasil diperbarui!');
        } else {
          // CREATE
          formData.timestamp_created = Date.now();
          formData.timestamp_taken = Date.now();
          formData.timestamp_close = formData.status === 'CLOSED' ? Date.now() : "";
          const newRef = push(ref(db, nodePath));
          await set(newRef, formData);
          alert('Data berhasil ditambahkan!');
        }
        closeModal();
        resetPagination();
      } catch (err) {
        alert("Gagal menyimpan data: " + err.message);
      }
    });

    // Modal Operations
    window.editRecord = (key) => {
      const item = currentData.find(d => d.key === key);
      if (!item) return;

      document.getElementById('recordKey').value = key;
      document.getElementById('tiket_id').value = item.tiket_id || '';
      document.getElementById('status').value = item.status || 'OPEN';
      document.getElementById('kategori_pekerjaan').value = item.kategori_pekerjaan || '';
      document.getElementById('segmen').value = item.segmen || '';
      document.getElementById('nama_teknisi').value = item.nama_teknisi || '';
      document.getElementById('username_teknisi').value = item.username_teknisi || '';
      document.getElementById('id_telegram_teknisi').value = item.id_telegram_teknisi || '';
      document.getElementById('nama_hd').value = item.nama_hd || '';
      document.getElementById('nik_hd').value = item.nik_hd || '';
      document.getElementById('id_telegram_hd').value = item.id_telegram_hd || '';
      document.getElementById('chat_id').value = item.chat_id || '';
      document.getElementById('message_id').value = item.message_id || '';
      document.getElementById('file_id').value = item.file_id || '';
      document.getElementById('timestamp_created').value = item.timestamp_created ? new Date(item.timestamp_created).toLocaleString() : '';
      document.getElementById('pesan').value = item.pesan || '';
      document.getElementById('keterangan').value = item.keterangan || '';

      modalTitle.textContent = "Edit Permintaan";
      modalForm.classList.remove('hidden');
    };

    window.deleteRecord = async (key) => {
      if (confirm("Apakah Anda yakin ingin menghapus data ini?")) {
        try {
          await remove(ref(db, `${nodePath}/${key}`));
          alert("Data berhasil dihapus.");
          resetPagination();
        } catch (err) {
          alert("Gagal menghapus: " + err.message);
        }
      }
    };

    btnOpenCreateModal.addEventListener('click', () => {
      permintaanForm.reset();
      document.getElementById('recordKey').value = '';
      document.getElementById('timestamp_created').value = 'Otomatis diisi sistem';
      modalTitle.textContent = "Tambah Permintaan Baru";
      modalForm.classList.remove('hidden');
    });

    function closeModal() {
      modalForm.classList.add('hidden');
    }

    btnCloseModal.addEventListener('click', closeModal);
    btnCancelModal.addEventListener('click', closeModal);

    function showLoading(state) {
      if (state) {
        loadingRow.classList.remove('hidden');
      } else {
        loadingRow.classList.add('hidden');
      }
    }

    // Initial Load
    resetPagination();
